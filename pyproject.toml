[project]
name = "mcp-drifter"
version = "0.1.0"
description = "Proxy-based regression-testing harness for MCP tool interfaces."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "agent", "testing", "regression", "llm"]
classifiers = [
    # Alpha, deliberately and not as boilerplate: the record/observe/score and
    # safety paths are exercised and independently validated, but behavioral
    # regression detection against a real (non-scripted) agent is unproven --
    # see docs/SPEC.md section 15 limitation 16. Claiming Beta here would
    # overstate evidence this project does not have.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    # F-38 (docs/SPEC.md §5.1): cli/http_proxy.py imports uvicorn directly to
    # host the HTTP agent adapter's ASGI app. Already present transitively via
    # `mcp` (confirmed via `uv pip list` before this feature was built), but
    # declared explicitly now that this project's own code imports it
    # directly -- relying on a transitive pin for a direct import is fragile
    # to a future `mcp` release dropping or reshaping it.
    "uvicorn>=0.34",
    # cli/http_proxy.py also imports sse_starlette.sse.AppStatus directly, to
    # work around a real, confirmed cross-invocation bug in that library (see
    # http_proxy.py's own docstring) -- same reasoning as uvicorn above.
    "sse-starlette>=2.0",
    # F-39 (docs/SPEC.md §5.1): cli/observe.py imports httpx2 (the MCP SDK's
    # own vendored httpx fork -- a real top-level installed package, not a
    # submodule of `mcp`) directly, to catch a real connectivity failure to
    # a `servers[].url` entry actionably rather than let a raw ExceptionGroup
    # traceback reach the user. Already present transitively via `mcp`
    # (confirmed via `uv pip list`), declared explicitly for the same reason
    # uvicorn/sse-starlette are above.
    "httpx2>=2.10",
]

[project.urls]
Homepage = "https://github.com/Tunasmelt/Drifter-MCP"
Repository = "https://github.com/Tunasmelt/Drifter-MCP"
Issues = "https://github.com/Tunasmelt/Drifter-MCP/issues"
Changelog = "https://github.com/Tunasmelt/Drifter-MCP/blob/master/docs/CHANGELOG.md"

[project.scripts]
drifter = "mcp_drifter.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "mcp_drifter",
    "mcp_drifter.record",
    "mcp_drifter.replay",
    "mcp_drifter.mutate",
    "mcp_drifter.evaluate",
    "mcp_drifter.mine",
    "mcp_drifter.policy",
    "mcp_drifter.cli",
]
