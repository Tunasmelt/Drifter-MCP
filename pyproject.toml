[project]
name = "mcp-drifter"
version = "0.1.0"
description = "Proxy-based regression-testing harness for MCP tool interfaces."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    # F-38 (docs/SPEC.md §5.1): cli/http_proxy.py imports uvicorn directly to
    # host the HTTP agent adapter's ASGI app. Already present transitively via
    # `mcp` (confirmed via `uv pip list` before this feature was built), but
    # declared explicitly now that this project's own code imports it
    # directly -- relying on a transitive pin for a direct import is fragile
    # to a future `mcp` release dropping or reshaping it.
    "uvicorn>=0.34",
    # cli/http_proxy.py also imports sse_starlette.sse.AppStatus directly, to
    # work around a real, confirmed cross-invocation bug in that library (see
    # http_proxy.py's own docstring) -- same reasoning as uvicorn above.
    "sse-starlette>=2.0",
]

[project.scripts]
drifter = "cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["record", "replay", "mutate", "evaluate", "mine", "policy", "cli"]
