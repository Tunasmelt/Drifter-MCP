# Drifter calibration register (SPEC.md §9).
#
# Every constant below is an engineering default, not a research finding —
# each ships as a documented guess until re-derived from real corpus data
# after Gate 2 (PHASES.md). Don't defend these values as-is before then.
# User-overridable: edit this file directly.

semantic_weight: 0.8
fidelity_floor: 0.70
fidelity_flag_threshold: 0.90

# Minimum VALID (post-exclusion) runs required in EACH arm before the
# Behavior axis reports anything but UNKNOWN (SPEC.md §15 limitation 16).
# At 1 valid run, baseline_spread and natural_variation are both 0.0 as
# artifacts of n=1, not measurements -- which made any deviation at all
# report a confident REGRESSION. See record/calibration.py for the full
# reasoning. A guess, like everything else here.
min_valid_runs: 3

# When `drifter coverage --curve` calls a corpus-growth curve flat
# (SPEC.md §15 limitation 16's experiment). Neither constant has been
# derived from a real single-task corpus yet -- that experiment has not
# been run. Expect `gain_per_session` to need revisiting: coverage
# approaches an asymptote, so gain-per-session shrinks as the corpus grows
# even while genuinely still climbing, and a fixed threshold that reads
# correctly at 5 sessions may fire spuriously at 50. If the curve declares
# a plateau while its own numbers are still visibly rising, suspect this
# constant first. Guesses, like everything else here.
plateau:
  gain_per_session: 0.02
  window: 3

# Behavior verdict (docs/PHASES.md R4): REGRESSION when the drop in the share of
# runs on the corpus's usual tool path is at least `margin` AND its interval's
# lower bound is above 0; NO_REGRESSION when the interval's upper bound is below
# `margin`; INCONCLUSIVE otherwise. z = 1.645 is a 90% two-sided interval.
# Chosen by simulation, not derived from real agents -- a guess like the rest.
behavior:
  margin: 0.3
  z: 1.645
  # Amendment A (R4): UNKNOWN when fewer baseline runs than this take the
  # corpus path -- it is then not this task's usual path.
  min_baseline_share: 0.5

# STALE since R4: the old effect-size rule these thresholds fed is gone.
# Kept only so older copies of this file still load.
effect_size:
  inconclusive: 1.0
  regression: 2.0

segmentation:
  # F-07: idle gap (seconds) above which heuristic segmentation starts a
  # new trajectory, unless a data-flow reference connects the calls.
  idle_gap_seconds: 30
  # Not in SPEC.md §9's original table — added here per CLAUDE.md's
  # invariant that new invented constants belong in this file, not
  # hardcoded. F-06's trace-context confidence (0.99) is a fixed
  # algorithmic value stated directly in FEATURES.md, not a guess, so it
  # stays in code; this one — how confident heuristic (non-trace-context)
  # grouping is — has no such basis and is a guess like the rest.
  heuristic_confidence: 0.6

baseline:
  repeats: 20

mutation:
  repeats:
    # SPEC.md §8's original three-stage ladder (screen every mutation once,
    # confirm the flagged ones at 5, resolve the stubborn ones at 20).
    # `screen`/`confirm` are STALE and unread as of F-27 — two reasons,
    # both real (see evaluate/scheduling.py):
    #   1. the ladder allocates budget ACROSS many mutations; `drifter run`
    #      compares exactly one operator, so there is nothing to triage.
    #   2. `screen: 1` cannot produce a verdict at all now — DEC-027's
    #      min_valid_runs (3) makes a one-run arm UNKNOWN by construction,
    #      so a 1-run screening stage could never flag or clear anything.
    # Kept rather than deleted: they are the right shape for a future
    # multi-mutation `drifter run`, and deleting them would lose that.
    screen: 1
    confirm: 5
    # Read for real: adaptive scheduling's ceiling, the most runs one
    # mutated arm may spend before it stops regardless of certainty.
    resolve: 20

# `drifter tasks mine` (F-28-F-30). All guesses; none derived from a real
# multi-week corpus, which does not exist yet -- that absence is why mining was
# deferred (docs/SPEC.md section 15 limitation 16). min_support is an absolute
# trajectory count, not a fraction: a fraction of a tiny corpus is noise.
# max_length also bounds the search -- gapped subsequences of a long trajectory
# grow exponentially, so it must not be unbounded.
mine:
  min_support: 2
  min_length: 2
  max_length: 6
  max_candidates: 10

doctor:
  # Not in SPEC.md §9's original table — same reasoning as
  # segmentation.heuristic_confidence above: a guessed operational
  # constant, not a research finding, so it lives here rather than
  # hardcoded in cli/doctor.py.
  connectivity_timeout_seconds: 10
