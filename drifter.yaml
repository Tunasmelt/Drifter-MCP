# Drifter project config (SPEC.md §11).
#
# Only `servers:` and `record:` are read by `drifter observe` (Gate 1,
# F-09) — the rest of the config surface (baseline, mutations, tasks,
# policy) lands in later gates. See SPEC.md §11 for the full eventual
# shape.

version: 1

servers:
  # PHASES.md Gate 0 item 5 (dogfood pairing): agent = Claude Code,
  # server = @modelcontextprotocol/server-filesystem. `command` is the
  # exact registered invocation confirmed via `claude mcp get filesystem`
  # — not the bare `npx -y @modelcontextprotocol/server-filesystem <path>`
  # a `claude mcp add` command's syntax might suggest. Claude Code wraps
  # it through `cmd /c` on Windows, since `npx` resolves to a `.cmd`
  # script here and can't be spawned directly without going through
  # cmd.exe. Single-quoted YAML strings, deliberately: the path contains
  # backslashes, which double-quoted YAML scalars would try to interpret
  # as escape sequences (see tests/cli/test_observe.py's _drifter_yaml
  # for the same bug already hit and fixed once in this project).
  - name: filesystem
    command: ['cmd', '/c', 'npx', '-y', '@modelcontextprotocol/server-filesystem', 'C:\Users\user\Desktop']

# Optional — defaults shown. `dir` is where session JSONL files land;
# raw frame mirrors go to the sibling `raw/` directory under the same
# parent (e.g. .drifter/runs -> .drifter/raw).
record:
  dir: .drifter/runs
  redact: shape
