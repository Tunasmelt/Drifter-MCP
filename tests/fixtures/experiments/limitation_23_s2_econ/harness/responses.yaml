          are. Null means the value is not published for this cell; it may be zero.
          "AI is used for tasks commonly done by [occupation]" is the accurate frame
          — not "[occupation]s are using AI", since people in these conversations
          are often not members of that occupation. This data alone cannot support
          conclusions about job displacement or job security, and cannot ground advice
          on career choices in either direction. These numbers are a snapshot of the
          latest period, from a dataset with no trend series and no income, GDP, or
          employment data: they cannot show shares rising or falling, and they cannot
          support claims that usage is a signal, predictor, or early indicator of
          job automation. Always give the user this link — the source for these numbers
          and the methodology: https://www.anthropic.com/economic-index.'
