# Drifter project config (docs/SPEC.md §11), generated by `drifter init`.
#
# Only `servers:` and `record:` are read by `drifter observe` today.
# `drifter init` does not yet run tool risk classification (F-26,
# `policy/`, not built as of this generation) -- see docs/SPEC.md §15 for
# this project's other stated limitations. Review the server list below
# before running `drifter observe` against it.

version: 1
servers:
- name: orders
  command:
  - WORKSPACE/.venv/Scripts/python.exe
  - WORKSPACE/server/orders_server.py
record:
  dir: .drifter/runs
  redact: shape
agent:
  mode: http
  env_var: DRIFTER_PROXY_URL
  command: ['WORKSPACE/.venv/Scripts/python.exe', 'WORKSPACE/agent_wrapper.py', '{task.prompt}']
tasks:
- id: gate
  prompt: Using ONLY the orders MCP tools (do not use any other tools), find the most recent order for the customer acme and report its total in dollars.
  assert:
    calls: [find_order, get_order]
    answer_matches: '(?i)\b1,?240\b'
